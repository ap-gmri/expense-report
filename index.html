<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMRI Expense Report</title>
<style>
/* GMRI 2024 PowerPoint master template: Avenir Next, black text, GMRI Blue #00608A and grey #7F7F7F accents.
   Extended palette colors are used sparingly, only for status. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#000000; --heading:#000000; --muted:#7F7F7F; --line:#D8D8D8; --line-strong:#B2B2B2;
  --accent:#00608A; --accent-hover:#004966; --accent-ink:#FFFFFF; --accent-soft:#E5EFF3;
  --grey:#7F7F7F; --contour:.95;
  --warn:#B94A40; --warn-soft:#F7E9E7; --ok:#057872; --ok-soft:#E3F2F0; --danger:#B94A40; --danger-soft:#F7E9E7;
  --sans:"Avenir Next LT Pro", "Avenir Next", Avenir, Arial, sans-serif;
  --mono:var(--sans);
  --r:14px; --page:#F5F7F8;
  --shadow:0 1px 2px rgba(12,38,52,.05), 0 6px 20px rgba(12,38,52,.06);
  --shadow-hi:0 2px 4px rgba(12,38,52,.06), 0 12px 28px rgba(12,38,52,.10);
  --ring:0 0 0 4px rgba(0,96,138,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1A22; --panel:#0B1A22; --surface:#10232D; --surface-2:#132A36; --ink:#F2F4F5; --heading:#FFFFFF; --muted:#A6B0B5; --line:#2A3E49; --line-strong:#4A616D;
    --accent:#5AB2D9; --accent-hover:#86C8E5; --accent-ink:#04202D; --accent-soft:#12303E;
    --grey:#A6B0B5; --contour:.35; --page:#08151C; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --shadow-hi:0 2px 6px rgba(0,0,0,.35), 0 14px 32px rgba(0,0,0,.35); --ring:0 0 0 4px rgba(90,178,217,.25);
    --warn:#F0928A; --warn-soft:#3A1C19; --ok:#5FC7BD; --ok-soft:#0F2E2B; --danger:#F0928A; --danger-soft:#3A1C19;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1A22; --panel:#0B1A22; --surface:#10232D; --surface-2:#132A36; --ink:#F2F4F5; --heading:#FFFFFF; --muted:#A6B0B5; --line:#2A3E49; --line-strong:#4A616D;
  --accent:#5AB2D9; --accent-hover:#86C8E5; --accent-ink:#04202D; --accent-soft:#12303E;
  --grey:#A6B0B5; --contour:.35; --page:#08151C; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --shadow-hi:0 2px 6px rgba(0,0,0,.35), 0 14px 32px rgba(0,0,0,.35); --ring:0 0 0 4px rgba(90,178,217,.25);
  --warn:#F0928A; --warn-soft:#3A1C19; --ok:#5FC7BD; --ok-soft:#0F2E2B; --danger:#F0928A; --danger-soft:#3A1C19;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:26px;font-weight:400;color:var(--accent)}
h3{font-size:16px;font-weight:600;color:var(--heading)}
p{margin:0}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.slidehead{position:relative;background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden}
.slidehead::before{content:"";position:absolute;left:0;top:0;height:100%;width:min(1100px,100%);background:var(--contours) left top/auto 100% no-repeat;opacity:var(--contour);pointer-events:none}
.slidehead-in{position:relative;max-width:920px;margin:0 auto;padding:30px 16px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px 24px;flex-wrap:wrap}
.slidehead h1{font-size:32px;font-weight:400;color:var(--accent);line-height:1.15}
.slidehead .saved{display:block;font-size:12px;color:var(--muted);min-height:18px;margin-top:4px}
.slidehead .logo{height:52px;width:auto;display:block}
.slidehead .logo-d{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .slidehead .logo-l{display:none} :root:not([data-theme="light"]) .slidehead .logo-d{display:block} }
:root[data-theme="dark"] .slidehead .logo-l{display:none}
:root[data-theme="dark"] .slidehead .logo-d{display:block}
@media (max-width:560px){ .slidehead-in{flex-direction:column-reverse;align-items:flex-start} .slidehead h1{font-size:26px} .slidehead .logo{height:42px} }

.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}

.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px;list-style:none;padding:0}
.stepper button{width:100%;text-align:left;background:none;border:0;border-top:3px solid var(--line);padding:8px 2px 0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.stepper button:disabled{cursor:default}
.stepper .n{font-weight:700}
.stepper .done{border-top-color:var(--accent);color:var(--ink)}
.stepper .cur{border-top-color:var(--accent);color:var(--accent);font-weight:600}
.stepper .done{border-top-color:var(--grey)}
@media (max-width:560px){ .stepper .lbl{display:none} .stepper .cur .lbl{display:inline} .stepper{grid-template-columns:repeat(4,auto);justify-content:start;column-gap:14px} }

.panel{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:24px}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.lead{color:var(--muted);max-width:62ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.span2{grid-column:span 2}
@media (max-width:640px){ .grid2,.grid3{grid-template-columns:1fr} .span2{grid-column:auto} .panel{padding:16px} }

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=date],input[type=month],input[type=number],select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.invalid{border-color:var(--danger)!important;background:var(--danger-soft)!important}
.err{font-size:12.5px;color:var(--danger)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.prefix{position:relative}
.prefix span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--mono)}
.prefix input{padding-left:24px;font-family:var(--mono)}

.btn{font:inherit;font-size:14px;font-weight:600;border-radius:3px;padding:9px 16px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn.danger.confirm{background:var(--danger);border-color:var(--danger);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

.note{border-radius:3px;padding:10px 12px;font-size:13.5px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px}
.note.warn{background:var(--warn-soft)}
.note b{font-weight:600}
.note .ic{flex:none;font-weight:700;color:var(--accent);font-family:var(--mono)}
.note.warn .ic{color:var(--warn)}

.adders{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){ .adders{grid-template-columns:1fr} }
.adder{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.adder:hover{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.adder b{font-size:15px}
.adder b{color:var(--accent)}
.adder b::before{content:"+ ";color:var(--accent)}
.adder span{font-size:13px;color:var(--muted)}

.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:28px 88px 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface)}
.item:first-child{border-top:0}
.item .ln{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .dt{font-family:var(--mono);font-size:13px}
.item .ttl{min-width:0}
.item .ttl div:first-child{font-weight:600;overflow-wrap:anywhere}
.item .amt{font-family:var(--mono);font-weight:500;text-align:right;min-width:86px}
.item .acts{display:flex;gap:2px}
.items .foot{display:flex;justify-content:space-between;padding:12px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-weight:700}
@media (max-width:640px){
  .item{grid-template-columns:1fr auto;gap:4px 10px}
  .item .ln{display:none}
  .item .dt{grid-column:1;order:1}
  .item .amt{order:2}
  .item .ttl{grid-column:1 / -1;order:3}
  .item .acts{grid-column:1 / -1;order:4;justify-content:flex-start}
}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.sub,.pill.na{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag{font-size:12px;color:var(--muted)}

.drop{font-weight:400!important;font-size:14px!important;border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;background:var(--surface);display:block}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop b{color:var(--accent)}
.filelist{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:6px 8px;background:var(--surface)}
.file .th{width:40px;height:40px;border-radius:4px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);flex:none;font-family:var(--mono)}
.file .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13.5px}
.file.missing{border-color:var(--warn);background:var(--warn-soft)}

.lookup{display:grid;grid-template-columns:1fr 200px auto;gap:10px;align-items:end}
@media (max-width:640px){ .lookup{grid-template-columns:1fr} }
.lk-opt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0}
.stops{display:flex;flex-direction:column;gap:10px}
.stop{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.stop-back{flex-direction:row;align-items:center;gap:12px}
.stop-h{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.stop-n{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.stop-g{display:grid;grid-template-columns:1fr 2fr;gap:10px}
@media (max-width:560px){ .stop-g{grid-template-columns:1fr} }
a[aria-disabled]{color:var(--muted);text-decoration:none;cursor:default}
.subform{border-left:3px solid var(--line-strong);padding-left:16px}
.calc{font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.calc b{font-weight:600}

.tbl-wrap{background:var(--surface);overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--surface-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td input[type=number]{width:90px;padding:5px 7px;font-family:var(--mono)}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
tfoot td{font-weight:700;background:var(--surface-2)}

.invoice{background:var(--surface);display:grid;grid-template-columns:repeat(4,1fr) auto;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.invoice > div{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.invoice > div:last-child{border-right:0;background:var(--accent-soft)}
.invoice .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.invoice .v{font-weight:600;overflow-wrap:anywhere}
.invoice .tot{font-family:var(--mono);font-size:20px;font-weight:600}
@media (max-width:720px){ .invoice{grid-template-columns:1fr 1fr} .invoice > div{border-bottom:1px solid var(--line)} .invoice > div:last-child{grid-column:1 / -1;border-bottom:0} }

.issues{display:flex;flex-direction:column;gap:6px}

.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bottombar-in{max-width:920px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.bottombar .tot{margin-right:auto;display:flex;flex-direction:column}
.bottombar .tot .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bottombar .tot .v{font-family:var(--mono);font-size:18px;font-weight:600}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner p{flex:1;min-width:200px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
.big-done{display:flex;gap:14px;align-items:flex-start}
.big-done .tick{width:40px;height:40px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-weight:700;flex:none;font-size:20px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

.prefix span{left:13px}
.prefix input{padding-left:30px!important}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lookup-box{background:var(--accent-soft);border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);border-radius:12px;padding:14px 16px}
.lookup-box .lookup input,.lookup-box .lookup select{background:var(--surface)}
.lookup-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--accent)}
.lookup-h svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.lookup-h .muted{font-weight:400}
.rate-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:12px;border-top:1px solid var(--line);margin-top:2px}
.period-row{display:grid;grid-template-columns:1fr 120px;gap:10px}
.head-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.head-row .saved{margin-top:0}
.reset-btn{font-size:13px;padding:5px 12px 5px 10px;gap:6px;color:var(--muted)}
.reset-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reset-btn:hover{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,24,32,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:440px;width:100%;padding:26px;display:flex;flex-direction:column;gap:12px}
.modal-card h2{font-size:22px}
.modal-card p{color:var(--muted);line-height:1.55}
.modal-card .row{margin-top:8px}
.modal-ic{width:44px;height:44px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center}
.modal-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.modal-open{overflow:hidden}
.sub-tbl td{vertical-align:middle;padding:6px 8px}
.sub-tbl input[type=text],.sub-tbl input[type=number]{width:100%;padding-top:8px;padding-bottom:8px;border-radius:10px}
.sub-tbl .prefix input{width:100%;text-align:right}
.sub-tbl tfoot td{font-weight:700}
.icon-btn{padding:2px 10px!important;font-size:18px;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- polish layer: softer, rounded, modern ---------- */
body{background:var(--page)}
.slidehead{background:var(--surface)}
.panel{border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);background:var(--surface);padding:28px}
@media (max-width:640px){ .panel{padding:18px} }
h2{letter-spacing:-.01em}
.lead{line-height:1.6}

input[type=text],input[type=date],input[type=month],input[type=number],select,textarea{border-radius:10px;border-color:var(--line);padding:10px 12px;transition:border-color .15s, box-shadow .15s;background:var(--surface)}
input[type=text]:hover,input[type=date]:hover,input[type=month]:hover,input[type=number]:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
td input[type=number]{border-radius:8px}
.invalid{box-shadow:0 0 0 3px var(--danger-soft)}

.btn{border-radius:999px;padding:10px 20px;transition:background .15s, border-color .15s, box-shadow .15s, transform .15s;border-color:var(--line)}
.btn:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn.primary{box-shadow:0 2px 6px rgba(0,96,138,.25)}
.btn.primary:hover{box-shadow:0 6px 16px rgba(0,96,138,.28);transform:translateY(-1px)}
.btn.primary:disabled{box-shadow:none;transform:none}
.btn.ghost{padding:6px 12px}
.btn.ghost:hover{background:var(--accent-soft);box-shadow:none;border-color:transparent}
.btn.ghost.danger:hover{background:var(--danger-soft)}

.stepper{gap:0;margin-bottom:24px}
.stepper li{display:flex;align-items:center;gap:12px;min-width:0}
.stepper li:not(:last-child)::after{content:"";flex:1;min-width:12px;height:2px;border-radius:2px;background:var(--line);margin-right:12px;pointer-events:none}
.stepper li:has(.done)::after{background:var(--accent)}
.stepper button{border-top:0;padding:0;align-items:center;gap:10px;font-size:13.5px;width:auto;flex:none}
.stepper .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);border:2px solid var(--line);color:var(--muted);font-weight:600;position:relative;z-index:1;transition:all .2s}
.stepper .done{color:var(--ink)}
.stepper .done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stepper .cur .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--ring)}
.stepper button:not(:disabled):hover .n{border-color:var(--accent)}
@media (max-width:560px){ .stepper li:not(:last-child)::after{display:none} }

.note{border-radius:12px;padding:12px 14px}
.note .ic{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;line-height:1}
.note.warn .ic{background:var(--warn);color:#fff}
.banner{border-radius:var(--r);border-color:transparent;padding:12px 16px}

.adders{gap:14px}

.tbl-wrap{border-radius:12px}
.invoice{border-radius:12px}

.bottombar{background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);box-shadow:0 -6px 24px rgba(12,38,52,.06)}
.big-done .tick{background:var(--ok-soft);color:var(--ok)}
.progress{border-radius:99px;border:0;height:8px}
@media (prefers-reduced-motion: reduce){ .btn,.adder{transition:none} .adder:hover,.btn.primary:hover{transform:none} }
</style>
</head>
<body>


<header class="slidehead" id="slidehead">
  <div class="slidehead-in">
    <div><h1>Employee Expense Report</h1><div class="head-row"><span class="saved" id="saved-note"></span><button class="btn ghost reset-btn" type="button" data-act="reset-open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>Start over</button></div></div>
    <div><img class="logo logo-l" id="logo-l" alt="Gulf of Maine Research Institute" hidden><img class="logo logo-d" id="logo-d" alt="Gulf of Maine Research Institute" hidden></div>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <ol class="stepper" id="stepper"></ol>
  <div id="main"></div>
</main>

<div class="modal" id="reset-modal" hidden role="dialog" aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-desc">
  <div class="modal-card">
    <div class="modal-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></div>
    <h2 id="reset-title">Start over?</h2>
    <p id="reset-desc">This clears everything in this expense report, including your details, expenses and attached receipts, so you can start a new one. It can't be undone.</p>
    <div class="row end"><button class="btn" type="button" id="reset-cancel" data-act="reset-cancel">Cancel</button><button class="btn danger confirm" type="button" data-act="reset-all">Clear everything</button></div>
  </div>
</div>

<div class="bottombar">
  <div class="bottombar-in" id="bottombar"></div>
</div>


<script>
/* =====================================================================
   SETTINGS — the only part AP normally needs to edit.
   ===================================================================== */
const CONFIG = {
  org: "Gulf of Maine Research Institute",
  apEmail: "accountspayable@gmri.org",
  // Fiscal year starts July 1. "end" names it by the year it ends (July 2026 - June 2027 = FY27); "start" would make that FY26.
  fiscalYearNamedBy: "end",
  policyLink: "https://gmri.box.com/s/i0n9pkqj3iobhr8yo73thj9un9sng24m",
  // Mileage rates by date range (YYYY-MM-DD). Add a new line each time the rate changes.
  mileageRates: [
    { from: "2026-01-01", to: "2026-06-30", rate: 0.725 },
    { from: "2026-07-01", to: "2026-12-31", rate: 0.76 }
  ],
  // Per diem (M&IE) policy. Meal shares, and the first/last-day cap as a share of the daily rate.
  perDiem: {
    domestic: { label: "Domestic", b: 0.20, l: 0.20, d: 0.60, cap: 0.75,
                rateLink: "https://www.gsa.gov/travel/plan-book/per-diem-rates", rateSource: "GSA" },
    intl:     { label: "International", b: 0.15, l: 0.25, d: 0.40, cap: 0.60,
                rateLink: "https://allowances.state.gov/web920/per_diem.asp", rateSource: "U.S. State Department" }
  },
  // Automatic domestic rate lookup through the GSA Per Diem API (free key: https://open.gsa.gov/api/perdiem/).
  // DEMO_KEY works for testing but allows only a few lookups per hour. Replace it with GMRI's own key.
  gsaApiKey: "DEMO_KEY",
  // When a rate comes from the GSA lookup, the worksheet records the source, so no rate page attachment is required.
  gsaLookupReplacesRatePage: true,
  dodRateLink: "https://www.travel.dod.mil/Travel-Transportation-Rates/Per-Diem/Per-Diem-Rate-Lookup/",
  certification: "I certify that the expenses listed in this report were incurred by me for GMRI business, follow the GMRI purchase and travel policies, and have not been reimbursed from any other source.",
  startWithExample: false
};
</script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const round2 = n => Math.round((Number(n) || 0) * 100 + Number.EPSILON * 100) / 100;
const USD = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const money = n => USD.format(n || 0);
function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${+m}/${+d}/${y}`; }
function monthLabel(ym) { if (!ym) return ""; const [y, m] = ym.split("-"); return new Date(+y, +m - 1, 1).toLocaleString("en-US", { month: "long", year: "numeric" }); }
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(Date.UTC(y, m - 1, d + n)); return dt.toISOString().slice(0, 10); }
function weekday(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)).toLocaleString("en-US", { weekday: "short", timeZone: "UTC" }); }
function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }

/* ---------- state ---------- */
function blankState() {
  return { v: 1, name: "", period: todayISO().slice(0, 7), items: [], certified: false, example: false };
}
let state = blankState();
let step = 0;
let maxStep = 0;
let editing = null;           // { item, isNew, errors }
let pendingDelete = null;
let showErrors = false;
let pdfResult = null;          // { bytes, filename }
const files = new Map();       // id -> { id, name, kind, pages, size, bytes, url }

const LS_KEY = "gmri-expense-draft-v1";
function saveDraft() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ state, step, maxStep })); $("#saved-note").textContent = "Draft saved in this browser"; }
  catch (e) { $("#saved-note").textContent = ""; }
}
function loadDraft() {
  try {
    const j = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (j && j.state) { state = Object.assign(blankState(), j.state); state.items.forEach(normItem); step = Math.min(j.step || 0, 2); maxStep = Math.min(j.maxStep || step, 3); return true; }
  } catch (e) {}
  return false;
}

/* IndexedDB keeps attached receipts between visits (same browser only). */
let dbp = null;
function idb() {
  if (dbp) return dbp;
  dbp = new Promise(res => {
    try {
      const r = indexedDB.open("gmri-expense-files", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("files", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  return dbp;
}
async function idbDo(mode, fn) {
  const db = await idb(); if (!db) return null;
  return new Promise(res => {
    try { const tx = db.transaction("files", mode); const req = fn(tx.objectStore("files")); tx.oncomplete = () => res(req && req.result); tx.onerror = () => res(null); }
    catch (e) { res(null); }
  });
}
const idbPut = rec => idbDo("readwrite", s => s.put({ id: rec.id, name: rec.name, kind: rec.kind, pages: rec.pages, size: rec.size, bytes: rec.bytes }));
const idbDel = id => idbDo("readwrite", s => s.delete(id));
const idbAll = () => idbDo("readonly", s => s.getAll());
const idbClear = () => idbDo("readwrite", s => s.clear());

function addFileRec(rec) {
  if (rec.kind === "image") rec.url = URL.createObjectURL(new Blob([rec.bytes], { type: "image/jpeg" }));
  files.set(rec.id, rec);
}
function referencedIds() {
  const ids = new Set();
  const add = it => (it.files || []).forEach(id => ids.add(id));
  state.items.forEach(add);
  if (editing) add(editing.item);
  return ids;
}
function gcFiles() {
  const keep = referencedIds();
  for (const [id, rec] of files) if (!keep.has(id)) { if (rec.url) URL.revokeObjectURL(rec.url); files.delete(id); idbDel(id); }
}

/* ---------- calculations ---------- */
function mileageRate(date) { const r = CONFIG.mileageRates.find(r => date && date >= r.from && date <= r.to); return r ? r.rate : null; }
function locFor(it, date) {
  const locs = it.locs || []; let L = locs[0] || { kind: "domestic", destination: "", rate: "" };
  for (let i = 1; i < locs.length; i++) if (locs[i].from && date >= locs[i].from) L = locs[i];
  return L;
}
function dayRate(it, d) { return d.rate !== "" && d.rate != null ? Number(d.rate) || 0 : Number(locFor(it, d.date).rate) || 0; }
function locLabel(L) { return String(L.destination || "").trim() || "(destination)"; }
function locRangeText(it, i) {
  const L = it.locs[i], nx = it.locs[i + 1];
  const from = i === 0 ? it.start : L.from;
  const to = nx && nx.from ? addDays(nx.from, -1) : it.end;
  return from && to ? (from === to ? fmtDate(from) : `${fmtDate(from)} to ${fmtDate(to)}`) : "";
}
function perDiemCalc(it) {
  const days = it.days || [];
  const long = days.length > 30;
  let total = 0;
  const rows = days.map((d, i) => {
    const L = locFor(it, d.date);
    const P = CONFIG.perDiem[L.kind] || CONFIG.perDiem.domestic;
    const rate = dayRate(it, d);
    const edge = i === 0 || i === days.length - 1;
    const computed = round2(rate * ((d.bf ? P.b : 0) + (d.lu ? P.l : 0) + (d.di ? P.d : 0)));
    const cap = edge ? round2(rate * P.cap) : null;
    let claimed = cap != null ? Math.min(computed, cap) : computed;
    if (long) claimed = claimed * 0.75;
    claimed = round2(claimed);
    total += claimed;
    return { d, L, P, rate, computed, cap, claimed, label: i === 0 ? "First day" : i === days.length - 1 ? "Last day" : "Full day" };
  });
  return { rows, total: round2(total), long };
}
function itemAmount(it) {
  if (it.type === "receipt") return round2(it.amount);
  if (it.type === "mileage") { const r = mileageRate(it.date); return r == null ? 0 : round2((Number(it.miles) || 0) * r); }
  if (it.type === "perdiem") return perDiemCalc(it).total;
  return 0;
}
function itemDateLabel(it) { return it.type === "mileage" && it.multiDay && it.dateEnd ? `${fmtDate(it.date)}–<br>${fmtDate(it.dateEnd)}` : fmtDate(itemDate(it)); }
function itemDate(it) { return it.type === "perdiem" ? it.start : it.date; }
function itemType(it) { return it.type === "mileage" ? "Mileage" : it.type === "perdiem" ? "Per Diem Meals" : "Expense"; }
const MEAL_WORDS = /\b(breakfast|lunch|dinner|meal|meals|restaurant|cafe|café|diner|grill|pub|bar|tavern|brewery|bistro|catering|food|drinks?|coffee)\b/i;
function stopAddr(st) { return String(st.address || "").trim(); }
function stopShort(st) {
  const nm = String(st.name || "").trim(); if (nm) return nm;
  const parts = stopAddr(st).split(",").map(x => x.trim()).filter(Boolean);
  return parts[1] || parts[0] || "?";
}
function normMileage(it) {
  if (it.type === "mileage" && !Array.isArray(it.stops)) {
    it.stops = [{ name: "", address: it.from || "" }, { name: "", address: it.to || "" }];
    delete it.from; delete it.to;
  }
  if (it.type === "mileage") it.stops.forEach(st => {
    if (st.address == null) { st.address = [st.street, st.city, st.state].map(x => String(x || "").trim()).filter(Boolean).join(", "); delete st.street; delete st.city; delete st.state; }
  });
  return it;
}
function normPerDiem(it) {
  if (it.type !== "perdiem") return it;
  if (!Array.isArray(it.locs)) {
    it.locs = [{ id: uid(), kind: it.kind || "domestic", destination: it.destination || "", rate: it.rate ?? "", rateSource: it.rateSource || null, lkCity: it.lkCity || "", lkState: it.lkState || "", from: it.start || "" }];
    ["kind", "destination", "rate", "rateSource", "lkCity", "lkState"].forEach(k => delete it[k]);
  }
  if (it.locs.length) it.locs[0].from = it.start || "";
  return it;
}
function sortLocs(it) {
  if (!it.locs || it.locs.length < 3) return;
  const first = it.locs[0], rest = it.locs.slice(1).sort((a, b) => (a.from || "9999").localeCompare(b.from || "9999"));
  it.locs = [first, ...rest];
}
function normItem(it) { return normSubLines(normPerDiem(normMileage(it))); }
function dateRangeText(it) { return it.multiDay && it.dateEnd ? `${fmtDate(it.date)} to ${fmtDate(it.dateEnd)}` : fmtDate(it.date); }
function routeText(it) {
  const pts = (it.stops || []).map(st => (String(st.name || "").trim() ? st.name.trim() + ", " : "") + stopAddr(st));
  return pts.join("  >  ") + (it.roundTrip ? "  >  back to start" : "");
}
function mapsUrl(it) {
  const pts = (it.stops || []).map(stopAddr).filter(Boolean);
  if (pts.length < 2) return "";
  const enc = encodeURIComponent, origin = pts[0];
  const dest = it.roundTrip ? origin : pts[pts.length - 1];
  const way = it.roundTrip ? pts.slice(1) : pts.slice(1, -1);
  return `https://www.google.com/maps/dir/?api=1&origin=${enc(origin)}&destination=${enc(dest)}${way.length ? "&waypoints=" + enc(way.join("|")) : ""}&travelmode=driving`;
}
function itemTitle(it) {
  if (it.type === "receipt") return it.description || "(no description)";
  if (it.type === "mileage") return `${(it.stops || []).map(stopShort).join(" to ")}${it.roundTrip ? ", round trip" : ""}, ${Number(it.miles) || 0} mi`;
  const days = (it.days || []).length;
  const dests = [...new Set((it.locs || []).map(locLabel))];
  return `${dests.join(" + ")}, ${days} day${days === 1 ? "" : "s"}`;
}
function receiptStatus(it) {
  if (it.type === "mileage") return (it.files || []).some(id => files.has(id)) ? { k: "ok", label: "Backup attached" } : { k: "na", label: "No receipt needed" };
  const have = (it.files || []).filter(id => files.has(id)).length;
  const lost = (it.files || []).length - have;
  if (it.type === "perdiem") {
    if (have) return { k: "ok", label: "Rate page attached" };
    if (CONFIG.gsaLookupReplacesRatePage && (it.locs || []).length && it.locs.every(L => L.kind === "domestic" && L.rateSource)) return { k: "ok", label: "Rate from GSA lookup" };
    return { k: "warn", label: lost ? "Re-attach rate page" : "Rate page missing" };
  }
  if (it.noReceipt) { const nb = (it.files || []).filter(id => files.has(id)).length; return { k: "sub", label: nb ? `Substitute + ${nb} backup` : "Substitute receipt" }; }
  if (lost) return { k: "warn", label: "Re-attach receipt" };
  return have ? { k: "ok", label: have > 1 ? `${have} receipts` : "Receipt attached" } : { k: "warn", label: "Receipt missing" };
}
function sortedItems() { return state.items.slice().sort((a, b) => (itemDate(a) || "").localeCompare(itemDate(b) || "")); }
function total() { return round2(state.items.reduce((s, it) => s + itemAmount(it), 0)); }
function fiscalQuarter(period) {
  if (!period) return null;
  const [y, m] = period.split("-").map(Number);
  const q = m >= 7 ? Math.floor((m - 7) / 3) + 1 : Math.floor((m - 1) / 3) + 3;
  const fy = m >= 7 ? y : y - 1;
  const named = CONFIG.fiscalYearNamedBy === "start" ? fy : fy + 1;
  return { q, label: `Q${q}`, fy: `FY${String(named % 100).padStart(2, "0")}` };
}
function quarterText(period) { const f = fiscalQuarter(period); return f ? `${f.label} of ${f.fy}` : ""; }
function invoiceNo() {
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const [y, m] = (state.period || "").split("-");
  return `${MON[(+m || 1) - 1]}${y || ""}-exp-`;
}
function fileBase() {
  const last = (state.name.trim().split(/\s+/).pop() || "Employee").replace(/[^A-Za-z0-9-]/g, "");
  return `ExpRpt_${last}_${state.period || "period"}`;
}

/* ---------- validation ---------- */
function detailsErrors() {
  const e = {};
  if (!state.name.trim()) e.name = "Please enter your full name, so we know who to reimburse.";
  if (!state.period) e.period = "Choose the month these expenses belong to.";
  return e;
}
function itemErrors(it) {
  const e = {};
  if (it.type === "receipt") {
    if (!it.date) e.date = "Enter the date you paid.";
    if (!String(it.description || "").trim()) e.description = "Say what it was and where.";
    if (!String(it.purpose || "").trim()) e.purpose = "Say why GMRI should pay for it.";
    if (!(Number(it.amount) > 0)) e.amount = "Enter the amount in US dollars.";
    if (it.foreign && !String(it.fxNote || "").trim()) e.fxNote = "Enter the original amount and exchange rate.";
    if (it.noReceipt) {
      if (!String(it.subVendor || "").trim()) e.subVendor = "Enter the vendor.";
      if (!(it.subLines || []).some(l => String(l.item || "").trim())) e.subItems = "List at least one item you bought.";
    }
  } else if (it.type === "mileage") {
    if (!it.date) e.date = it.multiDay ? "Enter the first day of the trip." : "Enter the date you drove.";
    else if (mileageRate(it.date) == null) e.date = "No mileage rate is set for this date. Contact Accounts Payable.";
    if (it.multiDay) {
      if (!it.dateEnd) e.dateEnd = "Enter the last day of the trip.";
      else if (it.date && it.dateEnd <= it.date) e.dateEnd = "The last day must be after the first day.";
      else if (it.date && mileageRate(it.date) != null && mileageRate(it.dateEnd) !== mileageRate(it.date)) e.dateEnd = "The mileage rate changed during these dates. Enter the miles before and after the change as two separate lines.";
    }
    (it.stops || []).forEach((st, i) => {
      const a = stopAddr(st);
      if (!a) e[`s${i}address`] = "Enter the street address.";
      else if (!/\d/.test(a) || !/[A-Za-z]{2,}/.test(a)) e[`s${i}address`] = "Include the building number and street, e.g. 350 Commercial St, Portland, ME.";
      else if (!a.includes(",")) e[`s${i}address`] = "Add the town and state after the street, e.g. 350 Commercial St, Portland, ME.";
    });
    if (!(Number(it.miles) > 0)) e.miles = "Enter the miles driven.";
    if (!String(it.purpose || "").trim()) e.purpose = "Say why you drove.";
  } else if (it.type === "perdiem") {
    if (!String(it.purpose || "").trim()) e.purpose = "Say why you traveled.";
    if (!it.start) e.start = "Enter the day you left.";
    if (!it.end) e.end = "Enter the day you returned.";
    if (it.start && it.end && it.end <= it.start) e.end = "Per diem is for overnight trips. The return date must be after the departure date.";
    if (it.start && it.end && (it.days || []).length >= 92) e.end = "Trips over 90 days need to be handled by Accounts Payable.";
    const seen = new Set();
    (it.locs || []).forEach((L, i) => {
      if (!String(L.destination || "").trim()) e[`l${i}destination`] = L.kind === "intl" ? "Enter the city and country." : "Enter the city and state.";
      if (!(Number(L.rate) > 0)) e[`l${i}rate`] = "Enter the daily M&IE rate for this location.";
      if (i > 0) {
        if (!L.from) e[`l${i}from`] = "Choose the first night you stayed here.";
        else if (it.start && it.end && (L.from <= it.start || L.from > it.end)) e[`l${i}from`] = "Choose a date after the departure date and no later than the return date.";
        else if (seen.has(L.from)) e[`l${i}from`] = "Another location already starts on this date.";
        if (L.from) seen.add(L.from);
      }
    });
  }
  return e;
}
function reviewIssues() {
  const out = [];
  if (!state.items.length) out.push({ k: "warn", t: "Add at least one expense." });
  sortedItems().forEach((it, i) => {
    const st = receiptStatus(it), n = i + 1;
    if (st.k === "warn") out.push({ k: "warn", t: `Line ${n} (${itemType(it)}): ${st.label.toLowerCase()}.`, id: it.id });
    if (it.type === "perdiem" && perDiemCalc(it).long) out.push({ k: "info", t: `Line ${n}: trips over 30 days are paid at 75% of the normal rate. This has been applied.` });
  });
  const outside = state.period && state.items.some(it => {
    const ds = [itemDate(it), it.type === "perdiem" ? it.end : it.type === "mileage" && it.multiDay ? it.dateEnd : ""].filter(Boolean);
    return ds.length && !ds.some(d => d.slice(0, 7) === state.period);
  });
  if (outside) out.push({ k: "info", t: "Some of your expenses are dated outside the selected period of time." });
  return out;
}

/* ---------- rendering ---------- */
const STEPS = ["Your details", "Expenses", "Review", "Download PDF"];
function render() {
  renderBanner(); renderStepper(); renderMain(); renderBottom();
}
function renderBanner() {
  $("#banner").innerHTML = state.example
    ? `<div class="banner"><p><b>This is example data</b> so you can see how the report works. Clear it when you're ready to enter your own expenses.</p><button class="btn" data-act="clear-example">Start my own report</button></div>` : "";
}
function renderStepper() {
  $("#stepper").innerHTML = STEPS.map((s, i) => {
    const cls = i === step ? "cur" : i <= maxStep ? "done" : "";
    return `<li><button class="${cls}" data-act="goto" data-step="${i}" ${i > maxStep || editing ? "disabled" : ""} aria-current="${i === step ? "step" : "false"}"><span class="n">${i + 1}</span><span class="lbl">${s}</span></button></li>`;
  }).join("");
}
function renderBottom() {
  const bb = $("#bottombar");
  if (editing) {
    bb.innerHTML = `<div class="tot"><span class="k">This expense</span><span class="v" id="edit-amt">${money(itemAmount(editing.item))}</span></div>
      <button class="btn" data-act="cancel-edit">Cancel</button><button class="btn primary" data-act="save-edit">Save expense</button>`;
    return;
  }
  const back = step > 0 ? `<button class="btn" data-act="back">Back</button>` : "";
  let next = "";
  if (step === 0) next = `<button class="btn primary" data-act="next">Next: add expenses</button>`;
  if (step === 1) next = `<button class="btn primary" data-act="next" ${state.items.length ? "" : "disabled"}>Next: review</button>`;
  if (step === 2) next = `<button class="btn primary" data-act="next" ${state.certified && state.items.length ? "" : "disabled"}>Next: create PDF</button>`;
  bb.innerHTML = `<div class="tot"><span class="k">Total due</span><span class="v">${money(total())}</span></div>${back}${next}`;
}
function refreshBottom() {
  const nx = $('#bottombar [data-act="next"]');
  if (nx && step === 2) nx.disabled = !(state.certified && state.items.length);
  const v = $("#bottombar .tot .v"); if (v && !editing) v.textContent = money(total());
}
function renderMain() {
  const m = $("#main");
  if (editing) { m.innerHTML = editorHTML(); afterEditorRender(); return; }
  if (step === 0) m.innerHTML = detailsHTML();
  if (step === 1) m.innerHTML = listHTML();
  if (step === 2) m.innerHTML = reviewHTML();
  if (step === 3) m.innerHTML = downloadHTML();
}

function fieldErr(errs, k) { return showErrors && errs[k] ? `<span class="err" id="err-${k}">${esc(errs[k])}</span>` : ""; }
function inv(errs, k) { return showErrors && errs[k] ? "invalid" : ""; }

function detailsHTML() {
  const e = detailsErrors();
  return `<section class="panel stack">
    <div class="stack-sm"><h2>Your details</h2>
      <p class="lead">This is a tool meant to help you put together an expense report with all of the necessary information and backup. All coding and approvals for this expense report will happen in Paymerang, after you send your expense report to AP. Please submit expenses for reimbursement monthly.</p></div>
    <div class="grid2">
      <div class="field span2"><label for="f-name">Your name</label>
        <input type="text" id="f-name" data-s="name" value="${esc(state.name)}" autocomplete="name" class="${inv(e, "name")}">
${fieldErr(e, "name")}</div>
      <div class="field"><label for="f-period">Expenses for the month of</label>
        <div class="period-row">
          <select id="f-period" data-pp="m" aria-label="Month" class="${inv(e, "period")}">${["January","February","March","April","May","June","July","August","September","October","November","December"].map((nm, i) => `<option value="${String(i + 1).padStart(2, "0")}" ${(state.period || "").slice(5, 7) === String(i + 1).padStart(2, "0") ? "selected" : ""}>${nm}</option>`).join("")}</select>
          <select id="f-period-y" data-pp="y" aria-label="Year">${(() => { const cy = +todayISO().slice(0, 4), sel = +(state.period || "").slice(0, 4) || cy; const ys = []; for (let yy = Math.min(cy - 2, sel); yy <= Math.max(cy + 1, sel); yy++) ys.push(yy); return ys.map(yy => `<option ${yy === sel ? "selected" : ""}>${yy}</option>`).join(""); })()}</select>
        </div>
        ${fieldErr(e, "period")}</div>

    </div>
    <div class="note"><span class="ic">i</span><p>If you have had any recent changes to your current mailing address or name, please reach out to AP to have that updated in our systems. It will not automatically update from Paylocity.</p></div>
  </section>`;
}

function listHTML() {
  const items = sortedItems();
  const rows = items.map((it, i) => {
    const st = receiptStatus(it);
    const del = pendingDelete === it.id
      ? `<button class="btn danger confirm" data-act="del-confirm" data-id="${it.id}">Delete</button><button class="btn ghost" data-act="del-cancel">Keep</button>`
      : `<button class="btn ghost" data-act="edit" data-id="${it.id}">Edit</button><button class="btn ghost danger" data-act="del" data-id="${it.id}">Remove</button>`;
    return `<div class="item">
      <span class="ln">${i + 1}</span>
      <span class="dt">${itemDateLabel(it)}</span>
      <div class="ttl"><div>${esc(itemTitle(it))}</div><div class="row" style="gap:8px"><span class="tag">${esc(itemType(it))}</span><span class="pill ${st.k}">${esc(st.label)}</span></div></div>
      <span class="amt">${money(itemAmount(it))}</span>
      <div class="acts">${del}</div></div>`;
  }).join("");
  return `<section class="stack">
    <div class="panel stack">
      <div class="stack-sm"><h2>Expenses</h2><p class="lead">Add each expense on its own line. Choose the kind of expense to start.</p></div>
      <div class="adders">
        <button class="adder" data-act="add" data-type="receipt"><span class="adder-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-2-1.4L14 21l-2-1.4L10 21l-2-1.4L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span><b>Expenses</b><span>Business purchases paid for with personal funds, e.g. group meals, parking fees, or supplies.</span></button>
        <button class="adder" data-act="add" data-type="mileage"><span class="adder-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3.5 16h17v2.5h-17z"/><circle cx="7.5" cy="13" r="1"/><circle cx="16.5" cy="13" r="1"/><path d="M5 11h14"/></svg></span><b>Mileage</b><span>Use of a personal vehicle for business.</span></button>
        <button class="adder" data-act="add" data-type="perdiem"><span class="adder-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 21V3c-2 1-3 3.5-3 7h3"/></svg></span><b>Per Diem Meals</b><span>Calculation page for an individual's meals while traveling.</span></button>
      </div>
      <p class="small">For any questions about reimbursable expenses, please refer to the Expense Reimbursement Policy here: <a href="${CONFIG.policyLink}" target="_blank" rel="noopener">${CONFIG.policyLink}</a></p>
    </div>
    ${items.length ? `<div class="items">${rows}<div class="foot"><span>${items.length} expense${items.length === 1 ? "" : "s"}</span><span class="num">${money(total())}</span></div></div>`
      : `<p class="muted" style="text-align:center;padding:12px">No expenses yet.</p>`}
  </section>`;
}

function fileListHTML(it) {
  return (it.files || []).map(id => {
    const f = files.get(id);
    if (!f) return `<div class="file missing"><span class="th">?</span><span class="nm">A file attached earlier isn't available in this browser. Remove it and attach it again.</span><button class="btn ghost danger" data-act="rm-file" data-id="${id}">Remove</button></div>`;
    const th = f.kind === "image" ? `<img class="th" src="${f.url}" alt="">` : `<span class="th">PDF</span>`;
    return `<div class="file">${th}<span class="nm">${esc(f.name)}<br><span class="muted small">${f.kind === "pdf" ? f.pages + " page" + (f.pages === 1 ? "" : "s") + " · " : ""}${fmtSize(f.size)}</span></span><button class="btn ghost danger" data-act="rm-file" data-id="${id}">Remove</button></div>`;
  }).join("");
}
function dropHTML(label, hint) {
  return `<div class="field"><span class="lab" id="drop-lab">${label}</span>
    <label class="drop" id="drop"><input type="file" id="f-files" multiple accept="application/pdf,.pdf,image/*">
      <span><b>Choose files</b> or drop them here</span><br><span class="muted small" id="drop-hint">${hint}</span></label>
    <div class="err" id="file-err" role="alert"></div>
    <div class="filelist" id="file-list"></div></div>`;
}
function inputField(it, e, k, label, { type = "text", hint = "", cls = "", attrs = "" } = {}) {
  const val = it[k] ?? "";
  return `<div class="field ${cls}"><label for="e-${k}">${label}</label>
    <input type="${type}" id="e-${k}" data-f="${k}" value="${esc(val)}" class="${inv(e, k)}" ${attrs}>
    ${hint ? `<span class="hint">${hint}</span>` : ""}${fieldErr(e, k)}</div>`;
}
function textField(it, e, k, label, hint = "", cls = "") {
  return `<div class="field ${cls}"><label for="e-${k}">${label}</label>
    <textarea id="e-${k}" data-f="${k}" class="${inv(e, k)}">${esc(it[k] || "")}</textarea>
    ${hint ? `<span class="hint">${hint}</span>` : ""}${fieldErr(e, k)}</div>`;
}
const RECEIPT_LABELS = {
  rec: ["Receipt", "PDF or photo. Include the itemized receipt, not just the card slip."],
  sub: ["Backup documentation (optional)", "Anything that supports the expense: a non-itemized receipt, the credit card slip, a statement line, or the restaurant's menu."]
};
function mileDatesHTML(it, e) {
  return it.multiDay
    ? `${inputField(it, e, "date", "First day", { type: "date" })}${inputField(it, e, "dateEnd", "Last day", { type: "date" })}`
    : `${inputField(it, e, "date", "Date driven", { type: "date" })}`;
}
function dropWrapHTML(it) {
  const L = it.noReceipt ? RECEIPT_LABELS.sub : RECEIPT_LABELS.rec;
  return `<div id="drop-wrap">${dropHTML(L[0], L[1])}</div>`;
}
function subLinesHTML(it) {
  return (it.subLines || []).map((l, i) => `<tr>
    <td><input type="text" data-sub="${i}" data-sk="item" value="${esc(l.item)}" placeholder="${i === 0 ? "e.g. Day parking" : ""}" aria-label="Item ${i + 1}"></td>
    <td class="r"><div class="prefix"><span>$</span><input type="number" data-sub="${i}" data-sk="amount" value="${esc(l.amount)}" min="0" step="0.01" inputmode="decimal" aria-label="Amount for item ${i + 1}"></div></td>
    <td class="c">${(it.subLines || []).length > 1 ? `<button class="btn ghost danger icon-btn" type="button" data-act="rm-subline" data-i="${i}" aria-label="Remove line ${i + 1}">×</button>` : ""}</td></tr>`).join("");
}
function subTotal(it) { return round2((it.subLines || []).reduce((a, l) => a + (Number(l.amount) || 0), 0)); }
function normSubLines(it) {
  if (it.type === "receipt" && !Array.isArray(it.subLines)) {
    it.subLines = [{ item: String(it.subItems || ""), amount: "" }];
    delete it.subItems;
  }
  return it;
}
function stopsHTML(it, e) {
  const n = it.stops.length;
  const rows = it.stops.map((st, i) => {
    const lab = i === 0 ? "Start" : `Stop / Destination ${i}`;
    const k = `s${i}address`;
    return `<div class="stop">
      <div class="stop-h"><span class="stop-n">${lab}</span>${i > 0 && n > 2 ? `<button class="btn ghost danger" type="button" data-act="rm-stop" data-i="${i}">Remove</button>` : ""}</div>
      <div class="stop-g">
        <div class="field"><label for="s-${i}-name" class="small">Place name (optional)</label><input type="text" id="s-${i}-name" data-stop="${i}" data-sk="name" value="${esc(st.name)}" placeholder="e.g. GMRI"></div>
        <div class="field"><label for="s-${i}-address" class="small">Address</label><input type="text" id="s-${i}-address" data-stop="${i}" data-sk="address" value="${esc(st.address)}" placeholder="e.g. 350 Commercial St, Portland, ME" autocomplete="off" class="${inv(e, k)}">${fieldErr(e, k)}</div>
      </div></div>`;
  }).join("");
  return rows + (it.roundTrip ? `<div class="stop stop-back"><span class="stop-n">Return</span><span class="muted small">Back to the start address</span></div>` : "");
}
function editorHTML() {
  const it = editing.item, e = itemErrors(it);
  const head = (t, s) => `<div class="stack-sm"><h2>${editing.isNew ? "Add" : "Edit"} ${t}</h2>${s ? `<p class="lead">${s}</p>` : ""}</div>`;
  if (it.type === "receipt") {
    return `<section class="panel stack">${head("expense", "")}
      <div class="grid2">
        ${inputField(it, e, "date", "Date paid", { type: "date" })}
        <div></div>
        ${inputField(it, e, "description", "What was it?", { cls: "span2", hint: "Be specific, for example: “Dinner at Fisherman's Forum, Rockport” or “Parking, Logan Airport, 3 days”." })}
        ${inputField(it, e, "purpose", "Business purpose", { cls: "span2" })}
        <div class="field"><label for="e-amount">Amount (US dollars)</label><div class="prefix"><span>$</span><input type="number" id="e-amount" data-f="amount" value="${esc(it.amount ?? "")}" min="0" step="0.01" inputmode="decimal" class="${inv(e, "amount")}"></div>${fieldErr(e, "amount")}</div>
      </div>
      <label class="check"><input type="checkbox" id="e-foreign" data-f="foreign" ${it.foreign ? "checked" : ""}><span>I paid in a foreign currency</span></label>
      <div class="subform" id="fx-block" ${it.foreign ? "" : "hidden"}>
        ${inputField(it, e, "fxNote", "Original amount and exchange rate", { hint: "If you have any documents showing what the amount paid in USD actually was, such as a line from a card or bank statement, please attach along with the actual receipt. If not available, please list the rate you used for conversion, e.g. “€84.00 at 1.09 = $91.56”." })}
      </div>
      <div id="drop-slot-top">${it.noReceipt ? "" : dropWrapHTML(it)}</div>
      <label class="check"><input type="checkbox" id="e-noReceipt" data-f="noReceipt" ${it.noReceipt ? "checked" : ""}><span>I don't have a receipt for this. Fill in a substitute receipt instead.</span></label>
      <div class="subform stack" id="sub-block" ${it.noReceipt ? "" : "hidden"}>
        <p class="muted small">This will create and fill out a Substitute Expense Receipt form, which will print as its own page in your PDF.</p>
        <div class="grid2">
          ${inputField(it, e, "subVendor", "Vendor", { cls: "span2" })}
          <div class="field span2"><span class="lab">Itemized list</span>
            <div class="tbl-wrap"><table class="sub-tbl">
              <thead><tr><th>Item purchased</th><th class="r" style="width:150px">Amount</th><th style="width:44px"><span class="sr">Remove</span></th></tr></thead>
              <tbody id="sub-lines">${subLinesHTML(it)}</tbody>
              <tfoot><tr><td>Items total</td><td class="r num" id="sub-total"></td><td></td></tr></tfoot>
            </table></div>
            <div class="row" style="justify-content:space-between"><button class="btn" type="button" data-act="add-subline">+ Add a line</button><span class="small" id="sub-check" role="status"></span></div>
            <span class="hint">Include tax and tip as their own lines if they were part of what you paid.</span>
            ${showErrors && e.subItems ? `<span class="err" id="err-subItems">${esc(e.subItems)}</span>` : `<span class="err" id="err-subItems" hidden></span>`}
          </div>
          ${textField(it, e, "subParticipants", "For group meals, list participants:", "", "")}
          ${textField(it, e, "subReason", "Optional: reason for missing receipt", "", "")}
        </div>
      </div>
      <div id="drop-slot-bottom">${it.noReceipt ? dropWrapHTML(it) : ""}</div>
    </section>`;
  }
  if (it.type === "mileage") {
    return `<section class="panel stack">${head("mileage", `Use of a personal vehicle for GMRI business can be reimbursed via the IRS mileage rate. For information about what qualifies as reimbursable mileage, please review our <a href="${CONFIG.policyLink}" target="_blank" rel="noopener">Expense Policy</a>.`)}
      <div class="stack-sm">
        <label class="check"><input type="checkbox" id="e-multiDay" data-f="multiDay" ${it.multiDay ? "checked" : ""}><span>This was a multi-day trip</span></label>
        <div class="grid2" id="mile-dates">${mileDatesHTML(it, e)}</div>
      </div>
      <div class="stack-sm"><h3>Route</h3>
        <label class="check"><input type="checkbox" id="e-roundTrip" data-f="roundTrip" ${it.roundTrip ? "checked" : ""}><span>Return to the start address (round trip)</span></label>
        <p class="muted small">Enter the full street address of each place, including town and state, in the order you drove.</p>
        <div class="stops" id="stops">${stopsHTML(it, e)}</div>
        <div class="row"><button class="btn" type="button" data-act="add-stop">+ Add a stop</button></div>
      </div>
      <div class="note map-note"><span class="ic">i</span><div class="stack-sm"><p>Check the driving distance in Google Maps, then enter the miles below. You can save the route as a PDF or screenshot and attach it as mileage backup.</p>
        <div class="row"><button class="btn" type="button" data-act="open-map">Open route in Google Maps</button><span class="small" id="map-msg" role="status"></span></div></div></div>
      <div class="grid2">
        ${inputField(it, e, "miles", "Total miles driven", { type: "number", attrs: 'min="0" step="0.1" inputmode="decimal"', hint: "The total for the whole route, including the drive back on a round trip." })}
        <div></div>
        ${inputField(it, e, "purpose", "Business purpose", { cls: "span2" })}
      </div>
      <div class="calc" id="mile-calc"></div>
      <p class="muted small">Rates: ${CONFIG.mileageRates.map(r => `$${r.rate.toFixed(3).replace(/0$/, "")}/mi from ${fmtDate(r.from)} to ${fmtDate(r.to)}`).join("; ")}.</p>
      ${dropHTML("Mileage Backup (optional)", "A PDF or screenshot from Google Maps (or similar) showing the route and total miles.")}
    </section>`;
  }
  // per diem
  return `<section class="panel stack">${head("per diem meals", "For overnight travel, GMRI pays a daily meals and incidentals (M&amp;IE) allowance instead of meal receipts. Lodging, airfare and other costs still go on their own lines with receipts. Day trips use actual meal receipts instead.")}
    <div class="grid2">
      ${inputField(it, e, "start", "Departure date", { type: "date" })}
      ${inputField(it, e, "end", "Return date", { type: "date" })}
      ${inputField(it, e, "purpose", "Business purpose of the trip", { cls: "span2" })}
    </div>
    <div class="stack-sm"><h3>Locations</h3>
      <p class="muted small">Stayed in more than one place? Add a location for each, domestic or international. Each day uses the rate for the place you stayed that night, and the return day uses the last location.</p>
      <div class="stops" id="locs">${locsHTML(it, e)}</div>
      <div class="row"><button class="btn" type="button" data-act="add-loc">+ Add another location</button></div>
    </div>
    ${dropHTML("Rate pages" + (CONFIG.gsaLookupReplacesRatePage ? " (not needed for domestic rates found with the lookup)" : ""), "Save the M&amp;IE rate page for each location as a PDF or screenshot, with the location circled or highlighted.")}
    <div class="stack-sm"><h3>Meals, day by day</h3>
      <p class="muted small">Untick any meal that was provided to you, for example by a conference, the hotel, or a hosted event. Group meals you paid for will be reimbursed separately, since they're more than just your travel meals, so untick those too. The first and last day are capped at 75% of the daily rate.</p>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Day</th><th>Location</th><th class="r">Rate</th><th class="c">Breakfast</th><th class="c">Lunch</th><th class="c">Dinner</th><th class="r">Claimed</th></tr></thead>
        <tbody id="pd-body"></tbody>
        <tfoot><tr><td colspan="7">Trip total</td><td class="r num" id="pd-total"></td></tr></tfoot>
      </table></div>
      <p class="muted small" id="pd-split"></p>
      <p class="note warn" id="pd-long" hidden><span class="ic">!</span><span>This trip is over 30 days, so each day is paid at 75% of the normal rate.</span></p>
    </div>
  </section>`;
}

function locsHTML(it, e) {
  const n = it.locs.length;
  return it.locs.map((L, i) => {
    const P = CONFIG.perDiem[L.kind];
    const k = f => `l${i}${f}`;
    const fld = (f, label, inner) => `<div class="field"><label for="l-${i}-${f}">${label}</label>${inner}${fieldErr(e, k(f))}</div>`;
    return `<div class="stop loc">
      <div class="stop-h"><span class="stop-n">Location ${i + 1}${n > 1 ? ` <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">· ${esc(locRangeText(it, i))}</span>` : ""}</span>${i > 0 ? `<button class="btn ghost danger" type="button" data-act="rm-loc" data-i="${i}">Remove</button>` : ""}</div>
      <div class="row" role="radiogroup" aria-label="Location ${i + 1} type">
        <label class="check"><input type="radio" name="kind-${L.id}" data-loc="${i}" data-lk="kind" value="domestic" ${L.kind === "domestic" ? "checked" : ""}><span>Domestic (U.S.)</span></label>
        <label class="check"><input type="radio" name="kind-${L.id}" data-loc="${i}" data-lk="kind" value="intl" ${L.kind === "intl" ? "checked" : ""}><span>International</span></label>
      </div>
      ${i > 0 ? `<div class="grid2">${fld("from", "First night here", `<input type="date" id="l-${i}-from" data-loc="${i}" data-lk="from" value="${esc(L.from || "")}" min="${esc(it.start ? addDays(it.start, 1) : "")}" max="${esc(it.end || "")}" class="${inv(e, k("from"))}">`)}</div>` : ""}
      ${L.kind === "domestic" ? `<div class="lookup-box stack-sm">
        <div class="lookup-h"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Find the GSA rate</span><span class="muted small">Optional: fills in the destination and rate below</span></div>
        <div class="lookup">
          <div class="field"><label for="l-${i}-lkCity" class="small">City</label><input type="text" id="l-${i}-lkCity" data-loc="${i}" data-lk="lkCity" value="${esc(L.lkCity || "")}" placeholder="e.g. Falmouth"></div>
          <div class="field"><label for="l-${i}-lkState" class="small">State</label><select id="l-${i}-lkState" data-loc="${i}" data-lk="lkState"><option value="">Choose…</option>${US_STATES.map(([c, nm]) => `<option value="${c}" ${L.lkState === c ? "selected" : ""}>${nm}</option>`).join("")}</select></div>
          <button class="btn" data-act="lookup" data-i="${i}" type="button">Look up rate</button>
        </div>
        <div id="lk-result-${i}" class="small" role="status">${lookupSummary(L)}</div>
        <span class="hint">Alaska, Hawaii, or a U.S. territory? Those rates aren't on GSA. Use the <a href="${CONFIG.dodRateLink}" target="_blank" rel="noopener">DoD per diem lookup</a> (the “Local Meals” amount), type it in below and attach the rate page.</span>
      </div>` : ""}
      <div class="rate-h">Rate for this location</div>
      <div class="grid2">

        ${fld("rate", "Daily M&amp;IE rate", `<div class="prefix"><span>$</span><input type="number" id="l-${i}-rate" data-loc="${i}" data-lk="rate" value="${esc(L.rate ?? "")}" min="0" step="0.01" inputmode="decimal" class="${inv(e, k("rate"))}"></div>

async function imageToJpeg(bytes, type) {
  const blob = new Blob([bytes], { type: type || "image/*" });
  let src;
  try { src = await createImageBitmap(blob, { imageOrientation: "from-image" }); }
  catch (e) {
    src = await new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(blob); img.onload = () => { URL.revokeObjectURL(u); res(img); }; img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("decode")); }; img.src = u; });
  }
  const w0 = src.width, h0 = src.height; if (!w0 || !h0) throw new Error("empty");
  const s = Math.min(1, 2200 / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0, c.width, c.height);
  const out = await new Promise(res => c.toBlob(res, "image/jpeg", 0.82));
  return await out.arrayBuffer();
}

async function gsaLookup(i) {

    if (!entries.length) { out.innerHTML = `<span class="err">GSA didn't return a rate for ${esc(city)}, ${st}. Check the spelling, or type the rate from the ${link}.</span>`; return; }
    const on = todayISO();

    });
    const seen = new Set(); list = list.filter(c => { const k = c.place + c.county + c.rate; if (seen.has(k)) return false; seen.add(k); return true; });
    lkChoices = list;

      list.map((c, j) => `<div class="lk-opt"><button class="btn" type="button" data-act="lk-pick" data-li="${i}" data-i="${j}">Use ${money(c.rate)}</button><span>${esc(c.place)}${c.county ? ` <span class="muted">(${esc(c.county)})</span>` : ""}</span></div>`).join("");

}

function clean(s) {

  return out;
}

        p.drawImage(img, { x: M + (BOX.w - w) / 2, y: M + BOX.h - h, width: w, height: h });
      } else {
        const src = await PDFDocument.load(f.bytes, { ignoreEncryption: true });
        const count = src.getPageCount();
        for (let i = 0; i < count; i++) {
          const sp = src.getPage(i);
          const rot = ((sp.getRotation().angle % 360) + 360) % 360;
          const label = baseLabel + (count > 1 ? ` - page ${i + 1} of ${count}` : "");
          try {
            if (rot) throw new Error("rotated");
            const emb = await doc.embedPage(sp);
            const p = doc.addPage([W, H]); band(p, label);
            const s = Math.min(BOX.w / emb.width, BOX.h / emb.height);
            const w = emb.width * s, h = emb.height * s;
            p.drawPage(emb, { x: M + (BOX.w - w) / 2, y: M + BOX.h - h, width: w, height: h });
            p.drawRectangle({ x: M + (BOX.w - w) / 2, y: M + BOX.h - h, width: w, height: h, borderColor: C.line, borderWidth: 0.5 });
          } catch (e) {
            const [cp] = await doc.copyPages(src, [i]); doc.addPage(cp); noFooter.add(cp);
          }
        }
      }
    } catch (e) {
      problems.push(f.name);
      newPage(`Receipt could not be included`);
      txt(`${baseLabel}: ${f.name}`, M, y - 10, { size: 10 });
      txt("This file could not be added automatically. Please email it to Accounts Payable with this report.", M, y - 26, { size: 10, color: C.warn });
    }
  }
  /* ---- footer ---- */
  const pages = doc.getPages(), total_ = pages.length;
  pages.forEach((p, i) => { if (noFooter.has(p)) return; p.drawText(clean(`${fileBase()}  -  Page ${i + 1} of ${total_}`), { x: M, y: 26, size: 7.5, font: F, color: C.muted }); });
  onProgress && onProgress(1, "Saving…");
  const bytes = await doc.save();
  return { bytes, pages: total_, problems };
}

async function build() {
  const btn = $("#build-btn"); if (btn) btn.disabled = true;
  const prog = $("#prog"), msg = $("#prog-msg");
  if (prog) prog.hidden = false;
  try {
    const r = await buildPdf((f, m) => { if (prog) prog.firstElementChild.style.width = Math.round(f * 100) + "%"; if (msg) msg.textContent = m; });
    pdfResult = { bytes: r.bytes, pages: r.pages, filename: fileBase() + ".pdf", problems: r.problems };
    renderMain();
    await savePdf();
    if (r.problems.length) { const el = $("#dl-msg"); if (el) el.textContent = `These files couldn't be merged and need to be emailed to Accounts Payable separately: ${r.problems.join(", ")}.`; }
  } catch (e) {
    console.error(e);
    if (msg) msg.textContent = "The PDF couldn't be created. Remove the most recently added receipt and try again, or contact Accounts Payable.";
    if (btn) btn.disabled = false;
  }
}
const downloadsP = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
async function savePdf() {
  if (!pdfResult) return;
  const el = $("#dl-msg");
  const blob = new Blob([pdfResult.bytes], { type: "application/pdf" });
  const dl = await Promise.race([downloadsP, new Promise(r => setTimeout(() => r(null), 1500))]);
  if (dl) {
    try { await dl.save({ filename: pdfResult.filename, data: blob }); if (el && !pdfResult.problems.length) el.textContent = ""; return; }
    catch (e) { if (e && e.code === "declined") { if (el) el.textContent = "Download cancelled. Select Download PDF again when you're ready."; return; } }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = pdfResult.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

      locs: [{ id: uid(), kind: "domestic", destination: "Woods Hole, MA", rate: 74, rateSource: null, lkCity: "Woods Hole", lkState: "MA", from: d(14) },
             { id: uid(), kind: "intl", destination: "Halifax, Canada", rate: 150, rateSource: null, lkCity: "", lkState: "", from: d(16) }],
      days: [{ date: d(14), rate: "", bf: true, lu: true, di: true }, { date: d(15), rate: "", bf: false, lu: true, di: true }, { date: d(16), rate: "", bf: true, lu: true, di: true }, { date: d(17), rate: "", bf: true, lu: true, di: false }] }

}

async function init() {
  if (typeof ASSETS !== "undefined") {
    const l = $("#logo-l"), d = $("#logo-d");
    l.src = ASSETS.logoBlue; d.src = ASSETS.logoWhite; l.hidden = false; d.hidden = false;
    document.documentElement.style.setProperty("--contours", `url("${ASSETS.contours}")`);
  }

}
